services:
    nominatim:
        container_name: nominatim
        # Build Image, then specify it below:
        image: mediagis/nominatim:4.4
        volumes:
            - ./local-pbf-directory:/nominatrim/data
            - ./local_postgres-data-directory:/var/lib/postgresql/14/main
        ports:
            - "8080:8080"
        environment:
            # Specify PBF_URL or PBF_PATH to proceed
            - PBF_URL=https://download.geofabrik.de/asia/iran-latest.osm.pbf
            - REPLICATION_URL=https://download.geofabrik.de/asia/iran-updates/
            - PBF_PATH: 
            - NOMINATIM_PASSWORD=very_secure_password
            - POSTGRES_PASSWORD=very_secure_password
        shm_size: 1gb
        restart: always

  postgis:
    image: postgis/postgis:14-3.3
    environment:
      - POSTGIS_PASSWORD=very_secure_password
    volumes:
      - ./localpostgis-data-directory:/var/lib/postgresql/data
    restart: always